[project]
name = "python-simple-tag-editor"
version = "0.1.0"
description = "A simple and unified audio tag editor for MP3, MP4, and AIFF files."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "mutagen>=1.48.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
